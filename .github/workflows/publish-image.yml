name: Publish image

on:
  workflow_call:
    inputs:
      image:
        description: Image name from the suite manifest.
        required: true
        type: string
      parent_image:
        default: ""
        description: Digest-pinned parent published by an upstream suite job.
        required: false
        type: string
      go_image:
        default: ""
        description: Digest-pinned ci-go used only to build utility helpers.
        required: false
        type: string
    outputs:
      record:
        description: Validated JSON record for the published candidate.
        value: ${{ jobs.publish.outputs.record }}
      reference:
        description: Digest-pinned candidate image reference.
        value: ${{ jobs.publish.outputs.reference }}

permissions:
  contents: read
  packages: write

env:
  BUILDX_VERSION: v0.38.2
  BUILDKIT_IMAGE: >-
    docker.io/moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
  CI_IMAGES_SBOM_GENERATOR: >-
    docker.io/docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

jobs:
  build:
    name: Build ${{ inputs.image }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish native candidate
        env:
          CI_IMAGES_PLATFORM: linux/${{ matrix.architecture }}
          IMAGE: ${{ inputs.image }}
          OUTPUT_FILE: ${{ runner.temp }}/published-image.json
          PARENT_IMAGE: ${{ inputs.parent_image }}
          GO_IMAGE: ${{ inputs.go_image }}
        run: |
          .github/scripts/publish-image.sh \
            "$IMAGE" \
            "$OUTPUT_FILE" \
            "$PARENT_IMAGE" \
            "$GO_IMAGE"

      - name: Upload platform record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ inputs.image }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/published-image.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish candidate (${{ inputs.image }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      record: ${{ steps.publish.outputs.record }}
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download platform records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-${{ inputs.image }}-*
          path: ${{ runner.temp }}/platforms

      - name: Assemble candidate index
        id: publish
        env:
          IMAGE: ${{ inputs.image }}
          OUTPUT_FILE: ${{ runner.temp }}/published-image.json
          RECORDS_DIRECTORY: ${{ runner.temp }}/platforms
        run: |
          .github/scripts/merge-image.sh \
            "$IMAGE" \
            "$OUTPUT_FILE" \
            "$RECORDS_DIRECTORY/candidate-$IMAGE-amd64/published-image.json" \
            "$RECORDS_DIRECTORY/candidate-$IMAGE-arm64/published-image.json"
          record=$(jq --compact-output . "$OUTPUT_FILE")
          reference=$(jq --exit-status --raw-output '.ref' "$OUTPUT_FILE")
          printf 'record=%s\n' "$record" >>"$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$reference" >>"$GITHUB_OUTPUT"
