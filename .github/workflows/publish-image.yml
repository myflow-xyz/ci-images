name: Publish image

on:
  workflow_call:
    inputs:
      image:
        description: Image name from the suite manifest.
        required: true
        type: string
      parent_image:
        default: ""
        description: Digest-pinned parent published by an upstream suite job.
        required: false
        type: string
    outputs:
      record:
        description: Validated JSON record for the published candidate.
        value: ${{ jobs.publish.outputs.record }}
      reference:
        description: Digest-pinned candidate image reference.
        value: ${{ jobs.publish.outputs.reference }}

permissions:
  contents: read
  packages: write

env:
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: >-
    docker.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  CI_IMAGES_SBOM_GENERATOR: >-
    docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68

jobs:
  build:
    name: Build ${{ inputs.image }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish native candidate
        env:
          CI_IMAGES_PLATFORM: linux/${{ matrix.architecture }}
          IMAGE: ${{ inputs.image }}
          OUTPUT_FILE: ${{ runner.temp }}/published-image.json
          PARENT_IMAGE: ${{ inputs.parent_image }}
        run: |
          .github/scripts/publish-image.sh \
            "$IMAGE" \
            "$OUTPUT_FILE" \
            "$PARENT_IMAGE"

      - name: Upload platform record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ inputs.image }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/published-image.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Publish candidate (${{ inputs.image }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      record: ${{ steps.publish.outputs.record }}
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download platform records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-${{ inputs.image }}-*
          path: ${{ runner.temp }}/platforms

      - name: Assemble candidate index
        id: publish
        env:
          IMAGE: ${{ inputs.image }}
          OUTPUT_FILE: ${{ runner.temp }}/published-image.json
          RECORDS_DIRECTORY: ${{ runner.temp }}/platforms
        run: |
          .github/scripts/merge-image.sh \
            "$IMAGE" \
            "$OUTPUT_FILE" \
            "$RECORDS_DIRECTORY/candidate-$IMAGE-amd64/published-image.json" \
            "$RECORDS_DIRECTORY/candidate-$IMAGE-arm64/published-image.json"
          record=$(jq --compact-output . "$OUTPUT_FILE")
          reference=$(jq --exit-status --raw-output '.ref' "$OUTPUT_FILE")
          printf 'record=%s\n' "$record" >>"$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$reference" >>"$GITHUB_OUTPUT"
