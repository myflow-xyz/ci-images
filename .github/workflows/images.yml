name: CI images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILDX_VERSION: v0.35.0

jobs:
  contract:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish_changed: ${{ steps.changes.outputs.publish_changed }}
      smoke_changed: ${{ steps.changes.outputs.smoke_changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify static contracts
        run: |
          bash -n \
            images/common/fetch-verified \
            images/playwright/check-version \
            tests/*.sh \
            tests/smoke/*.sh \
            .github/scripts/*.sh
          shellcheck \
            images/common/fetch-verified \
            images/playwright/check-version \
            tests/*.sh \
            tests/smoke/*.sh \
            .github/scripts/*.sh
          tests/static.sh
          git diff --check

      - name: Verify documentation
        run: |
          npm ci \
            --fund=false \
            --ignore-scripts \
            --no-audit \
            --prefix images/node/markdownlint
          images/node/markdownlint/node_modules/.bin/markdownlint-cli2 \
            README.md \
            "docs/**/*.md"

      - name: Verify workflows
        env:
          GOBIN: ${{ runner.temp }}/ci-tools
        run: |
          actionlint_module=$(
            jq --exit-status --raw-output \
              '.tools.base.actionlint.module' \
              manifests/versions.json
          )
          actionlint_version=$(
            jq --exit-status --raw-output \
              '.tools.base.actionlint.version' \
              manifests/versions.json
          )
          go install "${actionlint_module}@v${actionlint_version}"
          "$GOBIN/actionlint"

      - name: Classify changes
        id: changes
        env:
          BASE_SHA: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.base.sha ||
                github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.sha ||
                github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          publish_changed=false
          smoke_changed=false

          if [[ $EVENT_NAME == workflow_dispatch || $REF_TYPE == tag ||
                $BASE_SHA =~ ^0+$ ]]; then
            publish_changed=true
            smoke_changed=true
          else
            if [[ $EVENT_NAME == pull_request ]]; then
              diff_range="${BASE_SHA}...${HEAD_SHA}"
            else
              diff_range="${BASE_SHA}..${HEAD_SHA}"
            fi

            if ! git diff --quiet "$diff_range" -- \
              .dockerignore \
              .github/scripts \
              .github/workflows/images.yml \
              .github/workflows/publish-image.yml \
              images \
              manifests; then
              publish_changed=true
            fi

            if [[ $publish_changed == true ]] ||
              ! git diff --quiet "$diff_range" -- \
                .github/scripts \
                .github/workflows \
                tests; then
              smoke_changed=true
            fi
          fi

          printf 'publish_changed=%s\n' "$publish_changed" >>"$GITHUB_OUTPUT"
          printf 'smoke_changed=%s\n' "$smoke_changed" >>"$GITHUB_OUTPUT"

  smoke:
    name: Smoke (${{ matrix.platform }})
    if: >-
      github.event_name != 'pull_request' &&
      needs.contract.outputs.smoke_changed == 'true'
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker

      - name: Check Dockerfiles
        run: tests/dockerfiles.sh

      - name: Build native images
        run: tests/build-local.sh all

      - name: Run native image smoke tests
        run: tests/smoke-local.sh all

      - name: Run image-hosted policy checks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ci-base:test \
            shfmt -d \
              images/common/fetch-verified \
              images/playwright/check-version \
              tests/*.sh \
              tests/smoke/*.sh \
              .github/scripts/*.sh
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ci-node:test \
            markdownlint-cli2 README.md "docs/**/*.md"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            ci-base:test \
            actionlint

  publish-base:
    name: Publish candidate (base)
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.publish_changed == 'true' &&
      needs.smoke.result == 'success'
    needs:
      - contract
      - smoke
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: base

  publish-go:
    name: Publish candidate (go)
    needs: publish-base
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: go
      parent_image: ${{ needs.publish-base.outputs.reference }}

  publish-node:
    name: Publish candidate (node)
    needs: publish-base
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: node
      parent_image: ${{ needs.publish-base.outputs.reference }}

  publish-vite:
    name: Publish candidate (vite)
    needs: publish-node
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: vite
      parent_image: ${{ needs.publish-node.outputs.reference }}

  publish-playwright:
    name: Publish candidate (playwright)
    needs: publish-vite
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: playwright
      parent_image: ${{ needs.publish-vite.outputs.reference }}

  publish-postgres:
    name: Publish candidate (postgres)
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.contract.result == 'success' &&
      needs.contract.outputs.publish_changed == 'true' &&
      needs.smoke.result == 'success'
    needs:
      - contract
      - smoke
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image: postgres

  publish:
    name: Collect published candidates
    needs:
      - publish-base
      - publish-go
      - publish-node
      - publish-vite
      - publish-playwright
      - publish-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.collect.outputs.base_image }}
      images: ${{ steps.collect.outputs.images }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Collect published candidates
        id: collect
        env:
          BASE_RECORD: ${{ needs.publish-base.outputs.record }}
          GO_RECORD: ${{ needs.publish-go.outputs.record }}
          NODE_RECORD: ${{ needs.publish-node.outputs.record }}
          OUTPUT_FILE: ${{ runner.temp }}/published-images.json
          PLAYWRIGHT_RECORD: ${{ needs.publish-playwright.outputs.record }}
          POSTGRES_RECORD: ${{ needs.publish-postgres.outputs.record }}
          VITE_RECORD: ${{ needs.publish-vite.outputs.record }}
        run: |
          .github/scripts/collect-published-images.sh \
            "$OUTPUT_FILE" \
            "$BASE_RECORD" \
            "$GO_RECORD" \
            "$NODE_RECORD" \
            "$VITE_RECORD" \
            "$PLAYWRIGHT_RECORD" \
            "$POSTGRES_RECORD"
          base_image=$(
            jq --exit-status --raw-output '
              map(select(.name == "base")) |
              if length == 1 then .[0].ref
              else error("expected one base image")
              end
            ' "$OUTPUT_FILE"
          )
          images=$(jq --compact-output . "$OUTPUT_FILE")
          printf 'base_image=%s\n' "$base_image" >>"$GITHUB_OUTPUT"
          printf 'images=%s\n' "$images" >>"$GITHUB_OUTPUT"

  hosted-container:
    name: Hosted job-container compatibility
    if: needs.publish.result == 'success'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.publish.outputs.base_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify runner file-command mounts
        id: mounts
        run: |
          test "$(id -u)" = 1001
          test "$(id -g)" = 2001
          test "$(stat --format=%u "$GITHUB_ENV")" = 1001
          printf 'MFCI_FILE_COMMAND=ok\n' >>"$GITHUB_ENV"
          printf 'written=true\n' >>"$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify runner workspace mount
        env:
          OUTPUT_WRITTEN: ${{ steps.mounts.outputs.written }}
        run: |
          test "$MFCI_FILE_COMMAND" = ok
          test "$OUTPUT_WRITTEN" = true
          probe="$GITHUB_WORKSPACE/.mfci-write-probe"
          : >"$probe"
          rm -f "$probe"
          test -z "$(git status --short)"

  scan:
    name: Scan ${{ matrix.image.name }} (${{ matrix.platform }})
    if: >-
      needs.publish.result == 'success' &&
      needs.hosted-container.result == 'success'
    needs:
      - hosted-container
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.publish.outputs.images) }}
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_USERNAME: ${{ github.actor }}
        with:
          image-ref: ${{ matrix.image.ref }}
          version: v0.70.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          timeout: 20m

  promote:
    name: Promote verified images
    if: needs.scan.result == 'success'
    needs:
      - publish
      - scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digests
        env:
          PUBLISHED_IMAGES: ${{ needs.publish.outputs.images }}
          PUBLISHED_IMAGES_FILE: ${{ runner.temp }}/published-images.json
        run: |
          printf '%s\n' "$PUBLISHED_IMAGES" >"$PUBLISHED_IMAGES_FILE"
          .github/scripts/promote-images.sh "$PUBLISHED_IMAGES_FILE"
