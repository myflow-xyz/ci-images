name: CI / Verify Runner Helpers [PR + Push + Manual]

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-helper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHELLSPEC_SHA256: >-
    400d835466429a5fe6c77a62775a9173729d61dd43e05dfa893e8cf6cb511783
  SHELLSPEC_VERSION: 0.28.1

jobs:
  native:
    name: ci/ci-utils/native (platform=${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Qualify installed archives and guarded maintenance
        env:
          CI_UTILS_NATIVE_CONTROLLER: ghcr.io/myflow-xyz/ci-base:0.0.30@sha256:2728dbdfbf4b1103aee5467a81201808aec41e8430cfed95893608ba03d97305
        run: tests/ci-utils-native.sh

  macos-client:
    name: ci/ci-utils/native (platform=darwin/arm64)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qualify the macOS runner client
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          DOCKER_CONFIG: ${{ runner.temp }}/ci-utils-docker
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          brew install bash docker docker-buildx
          PATH="$(brew --prefix bash)/bin:$(brew --prefix docker)/bin:$PATH"
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          ln -s "$(brew --prefix docker-buildx)/bin/docker-buildx" "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          bash --version
          python3 --version
          docker buildx version
          for version in 0.0.31 0.0.32; do
            python3 .github/scripts/package-ci-utils.py "$version" "$GITHUB_SHA" \
              "$RUNNER_TEMP" "$RUNNER_TEMP/assets" --platform darwin/arm64
          done
          python3 -B scripts/tests/ci-utils/user_install_integration.py "$RUNNER_TEMP/assets" 0.0.31 0.0.32

  contract:
    name: ci/runner-helpers/contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            acl \
            git \
            jq \
            shfmt

          shellspec_archive="$RUNNER_TEMP/shellspec.tar.gz"
          shellspec_root="$RUNNER_TEMP/shellspec"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 5 \
            --retry-all-errors \
            --show-error \
            --silent \
            --tlsv1.2 \
            --output "$shellspec_archive" \
            "https://github.com/shellspec/shellspec/archive/refs/tags/${SHELLSPEC_VERSION}.tar.gz"
          printf '%s  %s\n' \
            "$SHELLSPEC_SHA256" \
            "$shellspec_archive" |
            sha256sum --check --status --strict
          mkdir -p "$shellspec_root"
          tar -xzf "$shellspec_archive" \
            --strip-components=1 \
            --directory "$shellspec_root"

      - name: Verify CLI contract
        run: |
          cd scripts
          "$RUNNER_TEMP/shellspec/shellspec"

      - name: Verify isolated Linux identity behavior
        run: |
          debian_image=$(
            jq -r \
              '.upstream_images.debian | "\(.reference)@\(.digest)"' \
              manifests/versions.json
          )
          docker run --rm \
            --network none \
            --user 0:0 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$debian_image" \
            bash /workspace/scripts/tests/setup-runner-user_integration.sh

      - name: Verify isolated Linux bootstrap behavior
        run: sudo scripts/tests/setup-runner-from-scratch_integration.sh

      - name: Verify isolated Linux permission behavior
        run: sudo scripts/tests/setup-runner-permissions_integration.sh
